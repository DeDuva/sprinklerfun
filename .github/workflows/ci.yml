name: CI

# How deploys are gated
#
# This workflow does NOT deploy. Vercel's Git integration builds production from
# `main` on every merge, and it has no native "wait for CI" setting — so the gate
# is at the MERGE, not at the deploy: a ruleset on `main` requires the
# `types + tests` and `lint` checks below and forbids direct pushes. Nothing red
# reaches `main`, and production only ever builds from `main`.
#
# That is why there is no deploy job and no Vercel token here. Deploying from
# Actions would need a long-lived credential to buy a guarantee branch
# protection already provides.
#
# If you rename the `test`, `lint`, `e2e` or `audit` job, update the ruleset's
# required checks to match, or the gate silently stops requiring anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede in-flight PR runs; leave `main` runs alone, since that run is the
  # post-merge signal on the merged result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Enrichment converts timestamps to LOCAL time so minute-of-day lines up with
  # configured start times, and rollups are computed server-side from that — so
  # the suite is timezone-sensitive by design. Runners default to UTC; pin the
  # property's zone (the same value production sets as APP_TIMEZONE) so CI
  # exercises the conditions the app actually runs in. Without this the suite
  # still passes under UTC, but only by luck: it fails under UTC+14.
  TZ: America/Los_Angeles

jobs:
  test:
    name: types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Includes the regression test that asserts the inter-station delay
      # estimator still reproduces the measured production result from the
      # committed fixtures in data/ — the derived-data paths rewrite every
      # rollup on save, so a silent change there would not be obvious.
      - name: Tests
        # With coverage, so the thresholds in vitest.config.mts are enforced
        # rather than decorative. They are a floor set just under the current
        # numbers — raise them as coverage improves, do not lower them to pass.
        run: npm run test:coverage

      # The date handling is local-time by design, so "passes in one timezone"
      # proves very little. These three are the boundaries that actually caught
      # bugs: UTC+14 broke the date helpers, UTC-11 is the far side of the same
      # problem, and Kolkata has a half-hour offset. Cheap — the suite runs in ~3s.
      - name: Tests (timezone boundaries)
        run: |
          set -euo pipefail
          for tz in UTC Pacific/Kiritimati Pacific/Midway Asia/Kolkata; do
            echo "::group::TZ=$tz"
            TZ="$tz" npx vitest run
            echo "::endgroup::"
          done

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # A real `next build` — the only check that catches a Next-specific break
      # (an RSC boundary violation, a bad "use client") before it reaches a
      # deploy. Kept as its own step so a build failure reads as a build failure
      # rather than as a mysterious server-start timeout.
      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs against the production build on a throwaway SQLite file, seeded
      # through the public API. No Vercel preview, no protection-bypass token,
      # no shared database.
      - name: End-to-end
        run: npm run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # At 0 advisories as of the dependency work, so this starts green and stays
      # meaningful. Dependabot opens the fixes; this is what stops one sitting
      # unnoticed in the meantime.
      - name: npm audit
        run: npm audit --audit-level=high

  lint:
    name: lint
    runs-on: ubuntu-latest
    # A real gate as of the commit that emptied the backlog of pre-existing
    # errors. `react-hooks/rules-of-hooks` in particular is the only thing that
    # catches an early return drifting back above a hook, which is a bug that
    # shows up as a crash on a user interaction rather than at build time.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
