name: CI

# How deploys are gated
#
# This workflow does NOT deploy. Vercel's Git integration builds production from
# `main` on every merge, and it has no native "wait for CI" setting — so the gate
# is at the MERGE, not at the deploy: a ruleset on `main` requires the
# `types + tests` check below and forbids direct pushes. Nothing red reaches
# `main`, and production only ever builds from `main`.
#
# That is why there is no deploy job and no Vercel token here. Deploying from
# Actions would need a long-lived credential to buy a guarantee branch
# protection already provides.
#
# If you rename the `test` job, update the ruleset's required check to match, or
# the gate silently stops requiring anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede in-flight PR runs; leave `main` runs alone, since that run is the
  # post-merge signal on the merged result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Enrichment converts timestamps to LOCAL time so minute-of-day lines up with
  # configured start times, and rollups are computed server-side from that — so
  # the suite is timezone-sensitive by design. Runners default to UTC; pin the
  # property's zone (the same value production sets as APP_TIMEZONE) so CI
  # exercises the conditions the app actually runs in. Without this the suite
  # still passes under UTC, but only by luck: it fails under UTC+14.
  TZ: America/Los_Angeles
  # Matches the Vercel project's Node.js Version. Keep the two in step, or CI
  # can pass on code the deploy rejects.
  NODE_VERSION: 24

jobs:
  test:
    name: types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Includes the regression test that asserts the inter-station delay
      # estimator still reproduces the measured production result from the
      # committed fixtures in data/ — the derived-data paths rewrite every
      # rollup on save, so a silent change there would not be obvious.
      - name: Tests
        run: npm test

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory, not a gate: `npm run lint` currently reports 6 pre-existing
    # errors — conditional hooks and a ref written during render in
    # FlowTimelineChart, an `any` in StationFlowChart, and a synchronous setState
    # in an effect in app/config/page.tsx. They are real React correctness bugs
    # and fixing them changes behaviour, so they are deliberately not bundled
    # into an unrelated change. Once they are fixed, delete this line and add
    # this job to the ruleset's required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
