name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede an in-flight PR run, but never kill a main run — that one may be
  # mid-deploy, and cancelling it would leave production in an unknown state.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Enrichment converts timestamps to LOCAL time so minute-of-day lines up with
  # configured start times, and rollups are computed server-side from that — so
  # the suite is timezone-sensitive by design. Runners default to UTC; pin the
  # property's zone (the same value production sets as APP_TIMEZONE) so CI
  # exercises the conditions the app actually runs in. Without this the suite
  # still passes under UTC, but only by luck: it fails under UTC+14.
  TZ: America/Los_Angeles
  # Matches the Vercel project's Node.js Version. Keep the two in step, or CI
  # can pass on code the deploy rejects.
  NODE_VERSION: 24

jobs:
  test:
    name: types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Includes the regression test that asserts the inter-station delay
      # estimator still reproduces the measured production result from the
      # committed fixtures in data/ — the derived-data paths rewrite every
      # rollup on save, so a silent change there would not be obvious.
      - name: Tests
        run: npm test

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory, not a gate: `npm run lint` currently reports 6 pre-existing
    # errors — conditional hooks and a ref written during render in
    # FlowTimelineChart, an `any` in StationFlowChart, and a synchronous setState
    # in an effect in app/config/page.tsx. They are real React correctness bugs
    # and fixing them changes behaviour, so they are deliberately not bundled
    # into an unrelated change. Once they are fixed, delete this line and the
    # job becomes a real gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  deploy:
    name: deploy production
    # The gate. Vercel's own Git integration deploys in parallel with Actions and
    # would ship a red build; routing the deploy through here means a failing
    # typecheck or test stops it. `lint` is deliberately not a dependency — it is
    # advisory (see above) and would block every deploy.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sprinklerfun.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Remote build, the same thing `vercel --prod` does from a laptop. The
      # project has no Git integration, so this is the only path that keeps
      # main and production in step.
      - name: Deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      # A green deploy step only means the build shipped. Confirm the running
      # site actually serves, so a broken runtime fails the pipeline rather than
      # sitting undetected until someone opens the app.
      - name: Smoke-test production
        run: |
          set -euo pipefail
          for path in /api/stats /api/delay; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
              --retry-all-errors "https://sprinklerfun.vercel.app$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
