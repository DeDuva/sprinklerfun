version: 2

# Nothing watched dependencies before this file existed. At the time it was added
# the project had 17 high-severity advisories outstanding, including one in `next`
# itself, and no signal anywhere that they existed.
#
# Security updates are separate from this config — those are enabled at the repo
# level and open as soon as an advisory lands, whatever the schedule below. They
# DO obey any `ignore` rule in this file, though, which is why majors are grouped
# below rather than ignored: ignoring majors would also block a security fix that
# happens to need one. This file governs the routine version drift.

updates:
  - package-ecosystem: npm
    directory: /
    # Monthly. A single-household app gains nothing from a weekly stream of
    # version bumps, and security updates cover anything urgent in between.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # At most two PRs a month: minor + patch together, and majors together.
    # Majors stay apart from the rest because they need reading, not just a
    # green check — but as one PR, not one per package. #50–#53 were four
    # separate PRs for upgrades #40 had already deliberately deferred.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # The workflow pins actions by commit SHA; Dependabot understands that form
    # and updates both the SHA and the trailing version comment together.
    groups:
      actions:
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: "ci"
